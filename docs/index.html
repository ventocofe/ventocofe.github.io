<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ventocofe</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0d0d0d;
color:#fff;
font-family:Poppins,sans-serif;
}

header{
height:70vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:
linear-gradient(
rgba(0,0,0,.7),
rgba(0,0,0,.9)
);
padding:20px;
}

.logo{
font-family:Cinzel,serif;
font-size:52px;
letter-spacing:3px;
color:#d4af37;
}

.tag{
margin-top:15px;
font-size:16px;
color:#ddd;
}

.btn{
margin-top:35px;
padding:15px 35px;
border-radius:40px;
background:#d4af37;
color:#111;
text-decoration:none;
font-weight:bold;
}


.container{
padding:20px;
max-width:600px;
margin:auto;
}


.card{
background:#171717;
border:1px solid #333;
border-radius:25px;
padding:25px;
margin-bottom:20px;
transition:.3s;
}

.card:hover{
border-color:#d4af37;
}


.card h2{
color:#d4af37;
font-size:22px;
margin-top:0;
}


.item{
padding:10px 0;
border-bottom:1px solid #333;
color:#eee;
}


footer{
text-align:center;
padding:30px;
color:#999;
font-size:14px;
}

.social{
display:flex;
justify-content:center;
gap:15px;
margin-top:20px;
}

.social a{
color:#d4af37;
text-decoration:none;
}

</style>

</head>


<body>


<header>

<div class="logo">
Ventocofe
</div>

<div class="tag">
Coffee & More
</div>


<a class="btn" href="#menu">
View Menu
</a>


</header>



<div class="container" id="menu">


<div class="card">
<h2>☕ Espresso</h2>
<div class="item">Espresso</div>
<div class="item">Americano</div>
<div class="item">Cappuccino</div>
</div>



<div class="card">
<h2>🥛 Lattes</h2>
<div class="item">Classic Latte</div>
<div class="item">Special Latte</div>
</div>



<div class="card">
<h2>🍵 Tea & Herbal</h2>
<div class="item">Special Tea</div>
<div class="item">Herbal Drinks</div>
</div>



<div class="card">
<h2>🥤 Smoothies</h2>
<div class="item">Fruit Smoothies</div>
<div class="item">Vento Special</div>
</div>



<div class="card">
<h2>🍫 Shakes</h2>
<div class="item">Chocolate Shake</div>
<div class="item">Vento Special Shake</div>
</div>


</div>



<footer>

<div>Ventocofe</div>

<div class="social">
<a href="#">Instagram</a>
<a href="#">Location</a>
<a href="#">Contact</a>
</div>

</footer>


</body>
</html>
